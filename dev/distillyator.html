<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Алхимический Дистиллятор (DOM + CSS + Web Audio)</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #121018;
    color: #e6edf3;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 20px;
  }

  .scene {
    position: relative;
    width: 740px;
    height: 440px;
    background: radial-gradient(circle at 50% 40%, #241e33 0%, #110e17 100%);
    border: 2px solid #38304d;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    overflow: hidden;
  }

  .pipes {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .pipe-copper {
    fill: none;
    stroke: #b45309;
    stroke-width: 10;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .pipe-highlight {
    fill: none;
    stroke: #f59e0b;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.5;
  }
  .pipe-vapor {
    fill: none;
    stroke: #a78bfa;
    stroke-width: 4;
    stroke-dasharray: 8 12;
    opacity: 0;
    transition: opacity 0.4s;
  }
  .pipe-vapor.active {
    opacity: 0.9;
    animation: flow 0.9s linear infinite;
  }
  @keyframes flow {
    to { stroke-dashoffset: -20; }
  }

  .burner {
    position: absolute;
    bottom: 24px;
    left: 85px;
    width: 130px;
    height: 18px;
    background: #2e2640;
    border-radius: 4px;
    border-top: 3px solid #4c3f6b;
  }
  .flames {
    position: absolute;
    bottom: 42px;
    left: 95px;
    width: 110px;
    height: 36px;
    display: flex;
    justify-content: space-around;
    align-items: flex-end;
    opacity: 0;
    transition: opacity 0.3s, transform 0.2s;
    transform-origin: bottom;
  }
  .flame {
    width: 18px;
    height: 32px;
    background: radial-gradient(circle at 50% 80%, #fff 5%, #a855f7 45%, #ec4899 85%, transparent 100%);
    border-radius: 50% 50% 20% 20%;
    animation: flicker 0.22s infinite alternate;
  }
  .flame:nth-child(2) { animation-delay: 0.08s; height: 36px; }
  .flame:nth-child(3) { animation-delay: 0.14s; }
  .flame:nth-child(4) { animation-delay: 0.05s; height: 35px; }
  @keyframes flicker {
    from { transform: scaleY(0.92) skewX(-2deg); }
    to   { transform: scaleY(1.06) skewX(2deg); }
  }

  .boiler {
    position: absolute;
    bottom: 70px;
    left: 60px;
    width: 180px;
    height: 210px;
    background: linear-gradient(90deg, #78350f 0%, #d97706 30%, #b45309 75%, #451a03 100%);
    border-radius: 28px 28px 14px 14px;
    border: 2px solid #92400e;
    box-shadow: inset 0 -10px 20px rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }
  .boiler.shake { animation: shake 0.14s infinite; }
  @keyframes shake {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-2px, 1px); }
    50% { transform: translate(2px, -1px); }
    75% { transform: translate(-1px, -2px); }
    100% { transform: translate(1px, 2px); }
  }
  .boiler-window {
    position: absolute;
    inset: 25px 20px 18px 20px;
    background: #14111c;
    border-radius: 12px;
    border: 3px solid #78350f;
    overflow: hidden;
  }
  .herbal-base {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 80%;
    background: linear-gradient(180deg, #10b981 0%, #065f46 100%);
    transition: height 0.5s;
  }
  .bubble {
    position: absolute;
    bottom: 4px;
    background: rgba(167, 243, 208, 0.65);
    border-radius: 50%;
    animation: rise linear forwards;
  }
  @keyframes rise {
    to { transform: translateY(-130px) scale(1.4); opacity: 0; }
  }

  .gauge {
    position: absolute;
    top: 115px;
    left: 122px;
    width: 56px;
    height: 56px;
    background: #faf5ff;
    border: 4px solid #4c1d95;
    border-radius: 50%;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .gauge::after {
    content: "";
    width: 8px;
    height: 8px;
    background: #2e1065;
    border-radius: 50%;
    z-index: 2;
  }
  .needle {
    position: absolute;
    bottom: 50%;
    left: calc(50% - 1.5px);
    width: 3px;
    height: 20px;
    background: #e11d48;
    transform-origin: bottom center;
    transform: rotate(-120deg);
    transition: transform 0.2s ease-out;
  }
  .temp-readout {
    position: absolute;
    top: 175px;
    left: 112px;
    width: 76px;
    text-align: center;
    background: #0f0c18;
    border: 1px solid #4c1d95;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
    padding: 2px 0;
    color: #c084fc;
  }

  .separator {
    position: absolute;
    top: 140px;
    left: 310px;
    width: 76px;
    height: 110px;
    background: rgba(216, 180, 254, 0.12);
    border: 2px solid rgba(216, 180, 254, 0.35);
    border-top: 12px solid #b45309;
    border-radius: 10px 10px 16px 16px;
    backdrop-filter: blur(2px);
    overflow: hidden;
  }
  .resin {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 0%;
    background: rgba(217, 119, 6, 0.55);
    transition: height 0.5s;
  }

  .condenser {
    position: absolute;
    top: 120px;
    left: 455px;
    width: 90px;
    height: 165px;
    background: rgba(56, 189, 248, 0.16);
    border: 2px solid #38bdf8;
    border-radius: 12px;
    box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.25);
  }
  .condenser-label {
    position: absolute;
    bottom: 6px;
    width: 100%;
    text-align: center;
    font-size: 11px;
    color: #7dd3fc;
  }

  .drop {
    position: absolute;
    top: 295px;
    left: 615px;
    width: 8px;
    height: 11px;
    background: #67e8f9;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    opacity: 0;
    z-index: 3;
  }
  .drop.fall { animation: drip 0.5s ease-in forwards; }
  @keyframes drip {
    0%   { transform: translateY(0) scale(0.7); opacity: 1; }
    100% { transform: translateY(105px) scale(1); opacity: 0.95; }
  }

  .flask {
    position: absolute;
    bottom: 24px;
    left: 560px;
    width: 118px;
    height: 130px;
    background: rgba(255, 255, 255, 0.07);
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-top: 8px solid #b45309;
    border-radius: 14px 14px 22px 22px;
    overflow: hidden;
  }
  .potion-fill {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 0%;
    background: rgba(250, 204, 21, 0.65);
    transition: height 0.3s, background 0.3s;
  }
  .flask-label {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 13px;
    text-align: center;
    text-shadow: 0 1px 4px #000;
    padding: 4px;
  }

  .controls {
    width: 740px;
    background: #1a1626;
    border: 1px solid #38304d;
    border-radius: 12px;
    padding: 14px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .slider-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }
  input[type="range"] { width: 100%; cursor: pointer; accent-color: #a855f7; }
  .status {
    flex: 1.5;
    font-size: 13px;
    line-height: 1.4;
    color: #a1a1aa;
  }
  .status strong { color: #f4f4f5; }

  .tanks {
    display: flex;
    gap: 8px;
    flex: 1;
  }
  button {
    background: #2e2640;
    color: #e6edf3;
    border: 1px solid #4c3f6b;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  button:hover { background: #3b3152; }
  button.active {
    background: #6d28d9;
    border-color: #a78bfa;
    color: #fff;
  }
  button.reset {
    background: #9f1239;
    border-color: #f43f5e;
  }
  button.reset:hover { background: #be123c; }
</style>
</head>
<body>

<div class="scene">
  <svg class="pipes" viewBox="0 0 740 440">
    <path class="pipe-copper" d="M 150 160 L 150 90 L 348 90 L 348 140" />
    <path class="pipe-highlight" d="M 150 160 L 150 90 L 348 90 L 348 140" />
    <path id="vapor1" class="pipe-vapor" d="M 150 160 L 150 90 L 348 90 L 348 140" />
    <path class="pipe-copper" d="M 365 140 L 365 90 L 500 90 L 500 135" />
    <path class="pipe-highlight" d="M 365 140 L 365 90 L 500 90 L 500 135" />
    <path id="vapor2" class="pipe-vapor" d="M 365 140 L 365 90 L 500 90 L 500 135" />
    <path class="pipe-copper" d="M 500 135 C 530 135, 530 160, 500 160 C 470 160, 470 185, 500 185 C 530 185, 530 210, 500 210 C 470 210, 470 235, 500 235 C 530 235, 530 260, 500 260 L 500 292 L 619 292" />
    <path id="vapor3" class="pipe-vapor" d="M 500 135 C 530 135, 530 160, 500 160 C 470 160, 470 185, 500 185 C 530 185, 530 210, 500 210 C 470 210, 470 235, 500 235 C 530 235, 530 260, 500 260 L 500 292 L 619 292" />
  </svg>

  <div id="flames" class="flames">
    <div class="flame"></div><div class="flame"></div>
    <div class="flame"></div><div class="flame"></div>
  </div>
  <div class="burner"></div>

  <div id="boiler" class="boiler">
    <div class="boiler-window" id="window">
      <div id="herbalBase" class="herbal-base"></div>
    </div>
  </div>
  <div class="gauge"><div id="needle" class="needle"></div></div>
  <div id="tempReadout" class="temp-readout">22.0 °C</div>

  <div class="separator"><div id="resin" class="resin"></div></div>

  <div class="condenser"><div class="condenser-label">Лёд 14°C</div></div>

  <div id="drop" class="drop"></div>
  <div class="flask">
    <div id="potionFill" class="potion-fill"></div>
    <div id="flaskLabel" class="flask-label">Летучий эфир<br>0 / 50 мл</div>
  </div>
</div>

<div class="controls">
  <div class="row">
    <div class="slider-group">
      <label for="heat">Мощность горелки: <strong id="heatVal">0%</strong></label>
      <input type="range" id="heat" min="0" max="100" value="0">
    </div>
    <div id="status" class="status">Режим ожидания.<br>Нажмите в любое место для включения звука и добавьте огонь.</div>
    <button id="soundToggle">🔊 Звук: ВКЛ</button>
    <button id="resetBtn" class="reset">Очистить всё</button>
  </div>
  <div class="row">
    <span style="font-size:13px;color:#a1a1aa;font-weight:600;">Приёмная колба:</span>
    <div class="tanks">
      <button class="tank-btn active" data-tank="0">1. Летучий эфир (50 мл)</button>
      <button class="tank-btn" data-tank="1">2. Чистый эликсир (700 мл)</button>
      <button class="tank-btn" data-tank="2">3. Тяжёлый осадок (250 мл)</button>
    </div>
  </div>
</div>

<script>
let audioCtx = null;
let soundEnabled = true;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('pointerdown', initAudio, { once: true });
document.getElementById('soundToggle').addEventListener('click', (e) => {
  initAudio();
  soundEnabled = !soundEnabled;
  e.target.textContent = soundEnabled ? '🔊 Звук: ВКЛ' : '🔇 Звук: ВЫКЛ';
});
function playDropSound(pitchBoost = 0) {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(520 + pitchBoost, t);
  osc.frequency.exponentialRampToValueAtTime(1180 + pitchBoost, t + 0.08);
  gain.gain.setValueAtTime(0.08, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.1);
}
function playBubbleSound() {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  const baseFreq = 170 + Math.random() * 140;
  osc.frequency.setValueAtTime(baseFreq, t);
  osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.75, t + 0.06);
  gain.gain.setValueAtTime(0.025, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.08);
}
function playClickSound() {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(740, t);
  gain.gain.setValueAtTime(0.05, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.06);
}
const heatSlider = document.getElementById('heat');
const heatVal = document.getElementById('heatVal');
const flames = document.getElementById('flames');
const boiler = document.getElementById('boiler');
const boilerWin = document.getElementById('window');
const herbalBaseEl = document.getElementById('herbalBase');
const resinEl = document.getElementById('resin');
const potionFillEl = document.getElementById('potionFill');
const flaskLabel = document.getElementById('flaskLabel');
const needle = document.getElementById('needle');
const tempReadout = document.getElementById('tempReadout');
const statusEl = document.getElementById('status');
const dropEl = document.getElementById('drop');
const vapors = [
  document.getElementById('vapor1'),
  document.getElementById('vapor2'),
  document.getElementById('vapor3')
];
let temp = 22.0;
let baseLevel = 80;
let resinLevel = 0;
let dropCooldown = 0;
let activeTank = 0;
const tanks = [
  { name: 'Летучий эфир', ml: 0, max: 50, color: 'rgba(250, 204, 21, 0.65)', dropColor: '#fef08a' },
  { name: 'Чистый эликсир', ml: 0, max: 700, color: 'rgba(56, 189, 248, 0.65)', dropColor: '#67e8f9' },
  { name: 'Тяжёлый осадок', ml: 0, max: 250, color: 'rgba(244, 63, 94, 0.65)', dropColor: '#fda4af' }
];
function updateFlaskUI() {
  const current = tanks[activeTank];
  potionFillEl.style.background = current.color;
  potionFillEl.style.height = (current.ml / current.max * 100) + '%';
  dropEl.style.background = current.dropColor;
  flaskLabel.innerHTML = current.name + '<br>' + current.ml + ' / ' + current.max + ' мл';
}
document.querySelectorAll('.tank-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    playClickSound();
    document.querySelectorAll('.tank-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTank = Number(btn.dataset.tank);
    updateFlaskUI();
  });
});
heatSlider.addEventListener('input', () => {
  const p = Number(heatSlider.value);
  heatVal.textContent = p + '%';
  flames.style.opacity = p > 0 ? Math.max(0.3, p / 100) : 0;
  flames.style.transform = 'scaleY(' + (0.4 + (p / 100) * 0.8) + ')';
});
document.getElementById('resetBtn').addEventListener('click', () => {
  playClickSound();
  heatSlider.value = 0;
  heatSlider.dispatchEvent(new Event('input'));
  temp = 22.0;
  baseLevel = 80;
  resinLevel = 0;
  dropCooldown = 0;
  tanks.forEach(t => t.ml = 0);
  boiler.classList.remove('shake');
  updateFlaskUI();
});
function spawnBubble() {
  const b = document.createElement('div');
  b.className = 'bubble';
  const size = 4 + Math.random() * 6;
  b.style.width = size + 'px';
  b.style.height = size + 'px';
  b.style.left = (10 + Math.random() * 110) + 'px';
  b.style.animationDuration = (0.6 + Math.random() * 0.6) + 's';
  boilerWin.appendChild(b);
  if (Math.random() < 0.35) playBubbleSound();
  setTimeout(() => b.remove(), 1200);
}
function triggerDrop() {
  dropEl.classList.remove('fall');
  void dropEl.offsetWidth;
  dropEl.classList.add('fall');
  const fillRatio = tanks[activeTank].ml / tanks[activeTank].max;
  playDropSound(fillRatio * 350);
}
setInterval(() => {
  const power = Number(heatSlider.value);
  const targetTemp = 22 + power * 0.82;
  temp += (targetTemp - temp) * 0.04;
  const angle = -120 + ((temp - 20) / 85) * 240;
  needle.style.transform = 'rotate(' + Math.max(-120, Math.min(125, angle)) + 'deg)';
  tempReadout.textContent = temp.toFixed(1) + ' °C';

  const boiling = temp >= 78.4 && baseLevel > 10;
  const overheating = temp > 94 && baseLevel > 10;
  if (temp > 62 && baseLevel > 10) {
    if (Math.random() < (temp - 58) / 40) spawnBubble();
  }
  boiler.classList.toggle('shake', overheating);
  vapors.forEach(v => v.classList.toggle('active', boiling));

  const current = tanks[activeTank];
  if (boiling && current.ml < current.max) {
    const rate = (temp - 78) * 0.35;
    dropCooldown -= rate;
    if (dropCooldown <= 0) {
      dropCooldown = 4;
      triggerDrop();
      current.ml = Math.min(current.max, current.ml + Math.round(4 + rate));
      baseLevel = Math.max(10, baseLevel - 0.32);
      resinLevel = Math.min(65, resinLevel + (overheating ? 0.65 : 0.15));
    }
  }
  herbalBaseEl.style.height = baseLevel + '%';
  resinEl.style.height = resinLevel + '%';
  updateFlaskUI();

  if (baseLevel <= 10) {
    statusEl.innerHTML = 'Перегонка завершена.<br>Эссенция в котле истощена, выключите горелку.';
  } else if (current.ml >= current.max) {
    statusEl.innerHTML = '⚠ Колба заполнена!<br>Переключите приёмную колбу ниже, чтобы продолжить сбор.';
  } else if (overheating) {
    statusEl.innerHTML = '⚠ Высокая температура!<br>Пошли тяжёлые смолы — переключите на 3-ю колбу или убавьте огонь.';
  } else if (boiling && tanks[0].ml >= 50 && activeTank === 0) {
    statusEl.innerHTML = '✓ Летучий эфир отобран.<br>Переключитесь на «2. Чистый эликсир».';
  } else if (boiling) {
    statusEl.innerHTML = '✓ Идёт конденсация зелья.<br>Следите за температурой и объёмом выбранной колбы.';
  } else if (power > 0) {
    statusEl.innerHTML = 'Разогрев отвара...<br>Испарение начнётся при достижении 78.4 °C.';
  } else {
    statusEl.innerHTML = 'Режим ожидания.<br>Добавьте мощность горелки для начала алхимической перегонки.';
  }
}, 100);
</script>

</body>
</html>
